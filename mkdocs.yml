site_name: AgriTwin-GH Documentation
site_description: AgriTwin Greenhouse Digital Twin - Documentation and Feature Demos
site_author: AgriTwin Team
repo_url: https://github.com/arjun-christopher/AgriTwin-GH
repo_name: AgriTwin-GH

# Set docs directory to repository root to include all markdown files
docs_dir: .
site_dir: site

# Exclude files from the documentation site
exclude_docs: |
  site/
  .git/
  .github/
  __pycache__/
  *.pyc
  .ipynb_checkpoints/
  
theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - awesome-pages  # Auto-discovers markdown files

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.critic
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/arjun-christopher

# Navigation structure
nav:
  - Home: docs/index.md
  - Feature Demos:
    - Guide: feature_demos/FEATURE_DEMOS_GUIDE.md
  - Data & Database:
    - Database Reference: docs/DATABASE_REFERENCE.md
    - PostgreSQL Quick Start: docs/POSTGRESQL_QUICKSTART.md
    - Image Storage Setup: docs/IMAGE_STORAGE_SETUP.md
    - Indoor Greenhouse Dataset: docs/INDOOR_GREENHOUSE_DATASET.md
    - Data Directory: docs/DATA.md
  - ML Models:
    - Disease Classification: docs/TOMATO_DISEASE_CLASSIFICATION.md
    - Growth Stage Classification: docs/TOMATO_GROWTH_STAGE_CLASSIFICATION.md
  - Deployment Guide: docs/DOCS_DEPLOYMENT.md
  - Repository README: README.md
